<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Declare</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column (max 480px). Light "morning" app shell; the declaration ritual is always a deep royal night screen so each declaration feels like a moment. */
:root{
  --bg:#F3F5FC; --surface:#FFFFFF; --ink:#141A3D; --ink2:#4A5175; --ink3:#868CAB;
  --royal:#2E3FC4; --royal-soft:#E4E8FB; --dawn:#FF9E7A; --line:#DFE3F3; --mint:#1E8A6A;
  --night1:#0F1446; --night2:#2A2378; --glow:255,158,122; --glow-solid:#FFB79B;
  --r-ink:#FFFFFF; --r-ink2:rgba(255,255,255,.68); --r-soft:rgba(255,255,255,.13); --r-line:rgba(255,255,255,.32);
  --hl:#FFD9C9; --nj:#C9D0FF; --btn-bg:#FFFFFF; --btn-ink:#1F2C93;
  --f-d:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-s:"Newsreader",Georgia,"Times New Roman",serif;
  --f-b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F2E; --surface:#151A44; --ink:#EEF0FA; --ink2:#B3B8D6; --ink3:#7E84A8;
  --royal:#7383FF; --royal-soft:#232A66; --line:#262C5E; --mint:#4CC29A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F2E; --surface:#151A44; --ink:#EEF0FA; --ink2:#B3B8D6; --ink3:#7E84A8;
  --royal:#7383FF; --royal-soft:#232A66; --line:#262C5E; --mint:#4CC29A; color-scheme:dark}

/* appearance skins (chosen in Settings); later in source so they win over the auto light/dark blocks */
:root[data-skin="dawn"]{--bg:#F3F5FC;--surface:#FFFFFF;--ink:#141A3D;--ink2:#4A5175;--ink3:#868CAB;--royal:#2E3FC4;--royal-soft:#E4E8FB;--line:#DFE3F3;--mint:#1E8A6A;color-scheme:light}
:root[data-skin="midnight"]{--bg:#0B0F2E;--surface:#151A44;--ink:#EEF0FA;--ink2:#B3B8D6;--ink3:#7E84A8;--royal:#7383FF;--royal-soft:#232A66;--line:#262C5E;--mint:#4CC29A;color-scheme:dark}
:root[data-skin="olive"]{--bg:#F1F4EE;--surface:#FFFFFF;--ink:#1B2A1F;--ink2:#4C5E50;--ink3:#86968A;--royal:#3E6B48;--royal-soft:#E1EBDF;--line:#DCE4D8;--mint:#2F7D4F;
  --night1:#13241A;--night2:#2E4A35;--glow:242,197,124;--glow-solid:#F2D39B;--hl:#F5E2B0;--nj:#CFE6C8;--btn-ink:#2E4A35;color-scheme:light}
:root[data-skin="rose"]{--bg:#FBF2F4;--surface:#FFFFFF;--ink:#2B1420;--ink2:#6A4A58;--ink3:#A58A96;--royal:#A23B5E;--royal-soft:#F6DFE7;--line:#F0DDE3;--mint:#2F7D5F;
  --night1:#2A0F1F;--night2:#5C1E3E;--glow:255,158,176;--glow-solid:#FFC2CE;--hl:#FFD3DD;--nj:#F6C9DA;--btn-ink:#5C1E3E;color-scheme:light}
:root[data-skin="ocean"]{--bg:#EDF6F8;--surface:#FFFFFF;--ink:#0F2A33;--ink2:#46626B;--ink3:#86A0A8;--royal:#0E7C8C;--royal-soft:#D9EEF1;--line:#D5E6EA;--mint:#1E8A6A;
  --night1:#06222B;--night2:#0E4A5A;--glow:127,224,214;--glow-solid:#B5F0E9;--hl:#C9F3EE;--nj:#A9DDE8;--btn-ink:#0E4A5A;color-scheme:light}
:root[data-skin="royal"]{--bg:#F4F1FA;--surface:#FFFFFF;--ink:#20163A;--ink2:#5A4E75;--ink3:#9488AE;--royal:#6A3FC4;--royal-soft:#E9E1F8;--line:#E5DDF2;--mint:#1E8A6A;
  --night1:#160C31;--night2:#3B2075;--glow:224,168,255;--glow-solid:#E9C7FF;--hl:#EBD3FF;--nj:#D4C8FF;--btn-ink:#3B2075;color-scheme:light}
:root[data-skin="ember"]{--bg:#16100E;--surface:#221917;--ink:#F6ECE6;--ink2:#C9B6AC;--ink3:#8F7B71;--royal:#FF8A5C;--royal-soft:#3A2520;--line:#3A2A25;--mint:#5CC79A;
  --night1:#1A0E0B;--night2:#4A1F14;--glow:255,176,103;--glow-solid:#FFC99A;--hl:#FFD7BF;--nj:#FFC2A3;--btn-ink:#4A1F14;color-scheme:dark}
:root[data-skin="linen"]{--bg:#FFFFFF;--surface:#F6F6F4;--ink:#141414;--ink2:#555552;--ink3:#8E8E8A;--royal:#141414;--royal-soft:#ECECE8;--line:#E6E6E2;--mint:#2E7D55;
  --night1:#FFFFFF;--night2:#F2F1EC;--glow:0,0,0;--glow-solid:#D8D6CF;--r-ink:#141414;--r-ink2:rgba(20,20,20,.6);--r-soft:rgba(20,20,20,.06);--r-line:rgba(20,20,20,.25);
  --hl:#141414;--nj:#555552;--btn-bg:#141414;--btn-ink:#FFFFFF;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--dawn);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.pad{padding-inline:20px}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--royal)}
.muted{color:var(--ink2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 20px;border-radius:16px;font-weight:700;font-size:17px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--royal);color:#fff}
.btn-light{background:var(--btn-bg);color:var(--btn-ink)}
.btn-ghost{box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn[disabled]{opacity:.4;pointer-events:none}
.view{padding-bottom:110px}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 8px}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.icon-btn svg{width:22px;height:22px}
.title-xl{font-size:32px;font-weight:800}

/* week strip */
.week{display:flex;justify-content:space-between;gap:6px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink3)}
.week i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal}
.week .on i{background:var(--royal);border-color:var(--royal);color:var(--bg)}
.week .today{color:var(--ink)}
.week .today i{border-color:var(--royal)}
.week i svg{width:14px;height:14px}

.streak{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.streak .num{font-family:var(--f-d);font-weight:800;font-size:44px;line-height:1;color:var(--royal);min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.streak b{display:block;font-size:16px}
.streak span{font-size:14px;color:var(--ink2)}

/* daily card */
.daily{border-radius:24px;padding:24px;color:var(--r-ink);background:radial-gradient(120% 90% at 100% 0%,rgba(var(--glow),.5),rgba(var(--glow),0) 55%),linear-gradient(160deg,var(--night2),var(--night1));display:flex;flex-direction:column;gap:14px}
.daily .eyebrow{color:var(--glow-solid)}
:root[data-skin="linen"] .daily .eyebrow{color:var(--ink2)}
.daily h2{font-size:28px;font-weight:800}
.daily p{color:var(--r-ink2);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--r-soft)}
.dots{display:flex;gap:5px}
.dots span{flex:1;height:5px;border-radius:5px;background:var(--r-soft)}
.dots span.on{background:var(--r-ink)}

.sec{margin-top:30px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-h h3{font-size:20px;font-weight:800}
.sec-h button{font-size:14px;font-weight:700;color:var(--royal)}

.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;width:100%}
.row:active{transform:scale(.99)}
.tile{flex:0 0 48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--royal-soft);font-family:var(--f-d);font-weight:800;font-size:18px}
.tile svg{width:24px;height:24px}
.tile img{width:34px;height:34px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.row .main{flex:1;min-width:0}
.row b{display:block;font-size:16px;line-height:1.25}
.row small{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.bar{height:5px;border-radius:5px;background:var(--royal-soft);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--royal);border-radius:5px}
.chev{color:var(--ink3);font-size:22px}

/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:40}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);padding:6px 0}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--royal)}

/* explore */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.search svg{width:18px;height:18px;color:var(--ink3);flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:transparent;font:16px var(--f-b);color:var(--ink);outline:none}
.snip{font-family:var(--f-s);font-size:15px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.back{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--royal);font-size:15px;padding:20px 20px 0}

/* empty */
.empty{text-align:center;padding:48px 24px;border:1.5px dashed var(--line);border-radius:20px;color:var(--ink2)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}

/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.stat b{display:block;font-family:var(--f-d);font-size:32px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink2)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:13px;margin-top:12px}
.cal-g .h{font-size:11px;font-weight:700;color:var(--ink3)}
.cal-g .d{aspect-ratio:1;max-width:100%;border-radius:10px;display:grid;place-items:center;color:var(--ink2);font-variant-numeric:tabular-nums}
.cal-g .d.on{background:var(--royal);color:#fff;font-weight:700}
.cal-g .d.t{box-shadow:inset 0 0 0 2px var(--royal)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.note p{font-family:var(--f-s);font-size:17px}
.note .meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--ink3)}
.note .ans{font-weight:700;color:var(--mint)}
.note button.mark{font-size:13px;font-weight:700;color:var(--royal);padding:6px 10px;border-radius:999px;background:var(--royal-soft)}

/* ritual */
.ritual{position:fixed;inset:0;z-index:60;color:var(--r-ink);display:flex;flex-direction:column;background:radial-gradient(90% 50% at 50% 115%,rgba(var(--glow),.4),rgba(var(--glow),0) 70%),linear-gradient(175deg,var(--night1) 10%,var(--night2) 100%);padding-top:env(safe-area-inset-top,0px)}
.ritual-in{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%}
.r-top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.r-top .icon-btn{color:var(--r-ink2)}
.segs{flex:1;display:flex;gap:4px}
.segs span{flex:1;height:4px;border-radius:4px;background:var(--r-soft)}
.segs span.on{background:var(--r-ink)}
.segs span.cur{background:var(--glow-solid)}
.segtxt{flex:1;text-align:center;font-size:14px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}
.r-meta{padding:6px 24px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.r-meta .c{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--glow-solid)}
:root[data-skin="linen"] .r-meta .c{color:var(--ink2)}
.r-meta .ref{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--r-soft)}
.r-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:22px 24px 12px;display:flex;flex-direction:column;justify-content:flex-start;gap:14px}
.r-body{-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent);padding-bottom:28px}
.r-body>p:first-child{margin-top:auto}
.r-body>p:last-child{margin-bottom:auto}
@media (max-height:760px){.r-body p{font-size:clamp(18px,5vw,21px);line-height:1.4}.r-body{padding-top:14px;gap:11px}.hold{height:56px}.r-foot{gap:6px}}
.r-body p{font-family:var(--f-s);font-size:clamp(21px,5.6vw,25px);line-height:1.42;animation:rise .55s both;animation-delay:calc(var(--d)*90ms)}
.r-body strong{font-weight:500;font-style:italic;color:var(--hl);background:linear-gradient(transparent 62%,rgba(var(--glow),.25) 62%)}
.r-body em.nj{font-style:normal;font-weight:500;color:var(--nj)}
@keyframes rise{from{opacity:.15;transform:translateY(8px)}to{opacity:1;transform:none}}
.r-foot{padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:center}
.r-actions{display:flex;align-items:center;gap:12px;width:100%}
.r-side{flex:0 0 64px;font-size:14px;font-weight:600;color:var(--r-ink2);padding:12px 0}
.hold{flex:1;position:relative;overflow:hidden;height:64px;border-radius:999px;background:var(--r-soft);box-shadow:inset 0 0 0 1.5px var(--r-line);font-weight:700;font-size:17px;touch-action:none;user-select:none;-webkit-user-select:none}
.hold .fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--p,0));background:linear-gradient(90deg,var(--glow-solid),var(--btn-bg))}
.hold .lbl{position:relative;z-index:1}
.hold.active .lbl{color:var(--btn-ink)}
.r-hint{font-size:13px;color:var(--r-ink2);text-align:center}
.amen{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-s);font-style:italic;font-size:64px;color:var(--r-ink);opacity:0;z-index:70;background:radial-gradient(circle,rgba(var(--glow),.35),rgba(var(--glow),0) 60%)}
.amen.show{animation:amen .8s ease both}
@keyframes amen{0%{opacity:0;transform:scale(.9)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}

/* finish */
.finish{padding:32px 20px 40px;display:flex;flex-direction:column;gap:18px}
.finish .big{font-family:var(--f-s);font-style:italic;font-size:56px;line-height:1;color:var(--royal)}
textarea{width:100%;min-height:96px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:17px/1.5 var(--f-s);padding:12px 14px;resize:vertical}
input.txt{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:18px var(--f-b);padding:14px 16px}

/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));gap:22px}
.ob.hero{color:var(--r-ink);background:radial-gradient(100% 60% at 80% 0%,rgba(var(--glow),.5),rgba(var(--glow),0) 60%),linear-gradient(170deg,var(--night2),var(--night1))}
.ob .grow{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.ob h1{font-size:clamp(38px,10vw,48px);font-weight:800}
.ob.hero p{color:var(--r-ink2);font-size:18px}
.ob-steps{display:flex;gap:6px}
.ob-steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.ob-steps span.on{background:var(--royal)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--royal);border-color:var(--royal);color:#fff}
.how{display:flex;flex-direction:column;gap:14px}
.how div{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.how b{flex:0 0 32px;height:32px;border-radius:50%;background:var(--royal-soft);color:var(--royal);display:grid;place-items:center;font-family:var(--f-d)}

/* grace day + badges + plan */
.week .grace i{border-style:dashed;border-color:var(--royal);color:var(--royal)}
.week .grace i svg{width:13px;height:13px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink3);text-align:center}
.badge b{font-family:var(--f-d);font-size:22px;font-weight:800;line-height:1;color:var(--ink3)}
.badge.got{border-color:var(--royal);color:var(--ink)}
.badge.got b{color:var(--royal)}
.celebrate{border-radius:20px;padding:20px;background:linear-gradient(160deg,var(--night2),var(--night1));color:var(--r-ink);display:flex;flex-direction:column;gap:6px}
.celebrate .eyebrow{color:var(--glow-solid)}
.celebrate h2{font-size:24px;font-weight:800}
.celebrate p{color:var(--r-ink2);font-size:15px}
.plan-done{font-size:13px;font-weight:700;color:var(--mint)}
.time-chips{display:flex;flex-wrap:wrap;gap:8px}
input.time{border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:17px var(--f-b);padding:10px 12px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.mini{font-size:13px;font-weight:700;color:var(--royal);padding:6px 10px;border-radius:999px;background:var(--royal-soft)}
/* share card overlay */
.card-ov{position:fixed;inset:0;z-index:95;background:rgba(5,7,20,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.card-ov img{max-width:min(100%,380px);max-height:68vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);-webkit-touch-callout:default}
.card-ov p{color:#fff;font-size:15px;text-align:center;max-width:340px}
.card-ov .btns{display:flex;gap:10px;width:100%;max-width:380px}
.card-ov .btn{flex:1}
.card-ov .btn-ghost{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
/* keep-safe banner (shown only inside the Whop app) */
.keep{border-radius:18px;padding:16px;background:var(--surface);border:1.5px solid var(--royal);display:flex;flex-direction:column;gap:8px}
.keep b{font-size:16px}
.keep p{font-size:14px;color:var(--ink2)}
.keep a{align-self:flex-start;font-weight:700;font-size:15px;color:#fff;background:var(--royal);padding:10px 16px;border-radius:12px;text-decoration:none}
.ob-link{color:var(--r-ink2);font-size:14px;text-align:center;text-decoration:underline}
.cal-links{display:flex;flex-direction:column;gap:10px}
.cal-links a{text-decoration:none}
/* skin picker */
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skin{display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;font-size:13px;font-weight:600;color:var(--ink2)}
.skin .sw{height:64px;border-radius:14px;border:2px solid var(--line);display:flex;align-items:flex-end;padding:8px;gap:5px;overflow:hidden}
.skin .sw i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(127,127,127,.35)}
.skin[aria-pressed="true"]{color:var(--ink)}
.skin[aria-pressed="true"] .sw{border-color:var(--royal);box-shadow:0 0 0 2px var(--royal)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(8,10,30,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--royal);color:#fff}
.danger{color:#D0384B;font-weight:700}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  get(){return new Promise(r=>{try{if(!IDB.db)return r(null);const q=IDB.db.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})},

  fetch('/api/state',{method:'POST',headers:Object.assign({'content-type':'application/json'},window.__authH?window.__authH():{}),body,keepalive:body.length<60000,credentials:'same-origin'}).catch(()=>{dirty=true}) }
function save(){try{S.tz=Intl.DateTimeFormat().resolvedOptions().timeZone||S.tz}catch(e){}const v=JSON.stringify(S);try{localStorage.setItem(KEY,v)}catch(e){} dirty=true; clearTimeout(syncT); syncT=setTimeout(pushState,1500)}

function streakInfo(){

  for(const s of subs){for(let d=0;d<DATA[ci].s[s].d.length;d++){const id=ci+'.'+s+'.'+d;if(!ex.has(id)&&!out.includes(id)){out.push(id);if(out.length>=n)return out}}}

/* ---------- routing ---------- */
let tab='today', route=null, SES=null;
function render(){
  if(obActive){renderOb();return}
  if(route&&route.name==='session'){renderSession();return}
  if(route&&route.name==='done'){renderDone();return}
  let body='';
  if(route&&route.name==='sub') body=viewCategory(route.ci);
  else if(tab==='today') body=viewToday();
  else if(tab==='explore') body=viewExplore();
  else if(tab==='saved') body=viewSaved();
  else body=viewProgress();
  app.innerHTML=`<div class="view">${body}</div>${nav()}`;
  const si=document.getElementById('q'); if(si){si.value=exploreQ;si.addEventListener('input',e=>{exploreQ=e.target.value;renderResults()});renderResults()}
}
function nav(){
  const b=(k,label,ic)=>`<button data-tab="${k}" ${tab===k&&!route?'aria-current="page"':''}>${ICON[ic]}${label}</button>`;
  return `<nav class="nav">${b('today','Today','home')}${b('explore','Explore','explore')}${b('saved','Saved','saved')}${b('progress','Journey','progress')}</nav>`;
}

/* ---------- today ---------- */
function viewToday(){
  const ids=daily(); const done=ids.filter(spokenToday).length; const all=done>=ids.length;
  const st=streak(); const cats=[...new Set(ids.map(i=>get(i).cat))];
  const head=all?'Today\'s declarations are spoken.':done?`${done} of ${ids.length} spoken. Finish strong.`:`${ids.length} declarations for your ${new Date().getHours()<17?'day':'night'}.`;
  const sub=all?'Well done. Keep going, or come back tomorrow for a fresh set.':'Speak each one out loud. About 5 minutes.';
  const focus=S.focus.filter(ci=>DATA[ci]);
  const answered=S.notes.filter(n=>n.answered).length;
  return `
  <div class="top"><div><p class="muted" style="font-size:15px">${greet()}${S.name?', '+esc(S.name):''}</p><h1 class="title-xl">Today</h1></div>
    <button class="icon-btn" data-act="settings" aria-label="Settings">${ICON.gear}</button></div>
  <div class="pad" style="display:flex;flex-direction:column;gap:16px;margin-top:8px">
    ${EMBEDDED?keepSafe():''}
    <div class="daily">
      <span class="eyebrow">Today's declarations</span>
      <h2>${head}</h2>
      <p>${sub}</p>
      <div class="dots">${ids.map(i=>`<span class="${spokenToday(i)?'on':''}"></span>`).join('')}</div>
      <div class="tags">${cats.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
      <button class="btn btn-light" data-act="${all?'more':'begin'}">${all?'Declare 7 more':done?'Continue':'Begin'}</button>
    </div>
    <div class="streak"><div class="num">${st}</div><div><b>${st===1?'day':'days'} in a row</b><span>${st?'Don\'t break the chain. Declare again tomorrow.':'Speak today to start your streak.'}</span></div></div>
    ${weekStrip()}
  </div>
  <div class="pad sec">
    ${S.remind?'':`<button class="row" data-act="settings" style="margin-bottom:12px"><span class="tile" style="color:var(--royal)">${ICON.bell}</span><span class="main"><b>Set a daily reminder</b><small>Get a Whop notification when it's time to declare</small></span><span class="chev">›</span></button>`}
    <div class="sec-h"><h3>Your journeys</h3><button data-act="settings">Edit</button></div>
    <div class="rows">${focus.length?focus.map(ci=>{const s=catStats(ci);return `
      ${(()=>{const p=plan(ci),dd=Math.min(planDay(ci),PLAN_DAYS);return p.done?`<div class="row">${tile(ci)}<span class="main"><b>${esc(planName(ci))}</b><small class="plan-done">Completed. Glory to God.</small><span class="row-actions" style="margin-top:8px"><button class="mini" data-act="planagain" data-ci="${ci}">Start round ${p.round+1}</button><button class="mini" data-act="settings">Choose another</button></span></span></div>`
      :`<button class="row" data-act="journey" data-ci="${ci}">${tile(ci)}<span class="main"><b>${esc(planName(ci))}</b><small>Day ${dd} of ${PLAN_DAYS} · Now: ${esc(currentSubName(ci))}</small><span class="bar"><i style="width:${(dd/PLAN_DAYS*100).toFixed(1)}%"></i></span></span><span class="chev">›</span></button>`})()}`}).join(''):`<button class="row" data-act="settings">${tile(0)}<span class="main"><b>Choose your journeys</b><small>Pick what you are believing God for and get ${PLAN_DAYS}-day plans</small></span><span class="chev">›</span></button>`}</div>
  </div>
  ${answered?`<div class="pad sec"><button class="row" data-tab="progress"><span class="tile" style="background:var(--mint);color:#fff">${answered}</span><span class="main"><b>${answered===1?'Prayer':'Prayers'} answered</b><small>See what God has done in your journal</small></span><span class="chev">›</span></button></div>`:''}`;
}

/* ---------- explore ---------- */
let exploreQ='';
function viewExplore(){
  return `<div class="top"><h1 class="title-xl">Explore</h1></div>
  <div class="pad" style="display:flex;flex-direction:column;gap:16px">
    <label class="search">${ICON.search}<input id="q" type="search" placeholder="Search declarations, e.g. womb, job, fear" autocomplete="off" aria-label="Search declarations"></label>
    <div id="results"></div>
  </div>`;
}
function renderResults(){
  const el=document.getElementById('results'); if(!el)return; const q=exploreQ.trim().toLowerCase();
  if(!q){
    el.innerHTML=`<div class="rows">${DATA.map((c,ci)=>{const s=catStats(ci);return `<button class="row" data-act="cat" data-ci="${ci}">${tile(ci)}<span class="main"><b>${esc(c.n)}</b><small>${s.t} declarations · ${c.s.length} decks${s.s?` · ${Math.round(s.s/s.t*100)}% spoken`:''}</small></span><span class="chev">›</span></button>`}).join('')}</div>`;
    return;
  }
  const res=[];
  DATA.forEach((c,ci)=>c.s.forEach((s,si)=>{
    if((c.n+' '+s.n).toLowerCase().includes(q)) res.push({k:'sub',ci,si});
  }));
  const dres=[];
  outer: for(let ci=0;ci<DATA.length;ci++){for(let si=0;si<DATA[ci].s.length;si++){const d=DATA[ci].s[si].d;for(let di=0;di<d.length;di++){if(plain(d[di]).toLowerCase().includes(q)){dres.push(ci+'.'+si+'.'+di);if(dres.length>=40)break outer}}}}
  el.innerHTML=(res.length||dres.length)?`<div class="rows">
    ${res.map(r=>`<button class="row" data-act="subopen" data-ci="${r.ci}" data-si="${r.si}">${tile(r.ci)}<span class="main"><b>${esc(DATA[r.ci].s[r.si].n)}</b><small>${esc(DATA[r.ci].n)}</small></span><span class="chev">›</span></button>`).join('')}
    ${dres.map(id=>{const x=get(id);return `<button class="row" data-act="one" data-id="${id}"><span class="main"><small>${esc(x.sub)}</small><span class="snip">${esc(plain(x.text))}</span></span></button>`}).join('')}
  </div>`:`<div class="empty"><h3>Nothing found</h3><p>Try a simpler word, like "children" or "money".</p></div>`;
}
function viewCategory(ci){
  const c=DATA[ci];
  return `<button class="back" data-act="back">‹ Explore</button>
  <div class="top" style="padding-top:8px"><h1 class="title-xl">${esc(c.n)}</h1></div>
  <div class="pad" style="display:flex;flex-direction:column;gap:14px">
    <p class="muted">Each deck opens 7 declarations at a time, starting where you left off.</p>
    <div class="rows">${c.s.map((s,si)=>{const st=subStats(ci,si);return `<button class="row" data-act="subopen" data-ci="${ci}" data-si="${si}"><span class="main"><b>${esc(s.n)}</b><small>${st.s===st.t?'Completed · tap to revisit':`${st.s} of ${st.t} spoken`}</small><span class="bar"><i style="width:${(st.s/st.t*100).toFixed(1)}%"></i></span></span><span class="chev">›</span></button>`}).join('')}</div>
    ${S.focus.includes(ci)?'':`<button class="btn btn-ghost" data-act="addfocus" data-ci="${ci}">Add to my journeys</button>`}
  </div>`;
}

/* ---------- saved ---------- */
function viewSaved(){
  S.saved=S.saved.filter(valid);
  return `<div class="top"><h1 class="title-xl">Saved</h1></div>
  <div class="pad">${S.saved.length?`<div class="rows">${S.saved.map((id,k)=>{const x=get(id);return `<button class="row" data-act="savedopen" data-k="${k}"><span class="main"><small>${esc(x.cat)} · ${esc(x.sub)}</small><span class="snip">${esc(plain(x.text))}</span></span></button>`}).join('')}</div>`
  :`<div class="empty"><h3>Nothing saved yet</h3><p>Tap the bookmark on any declaration to keep it here for the days you need it most.</p></div>`}</div>`;
}

/* ---------- progress ---------- */
function viewProgress(){
  const st=streak(); S.best=Math.max(S.best||0,st);
  const answered=S.notes.filter(n=>n.answered).length;
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate(), off=(first.getDay()+6)%7;
  let cal=['M','T','W','T','F','S','S'].map(h=>`<span class="h">${h}</span>`).join('');
  for(let i=0;i<off;i++)cal+='<span></span>';
  for(let d=1;d<=days;d++){const k=y+'-'+pad(m+1)+'-'+pad(d);cal+=`<span class="d ${S.days[k]?'on':''} ${d===now.getDate()?'t':''}">${d}</span>`}
  const active=DATA.map((_,ci)=>ci).filter(ci=>catStats(ci).s>0||S.focus.includes(ci));
  const notes=[...S.notes].reverse();
  return `<div class="top"><h1 class="title-xl">Your journey</h1></div>
  <div class="pad" style="display:flex;flex-direction:column;gap:16px">
    <div class="stats">
      <div class="stat"><b>${st}</b><span>Day streak</span></div>
      <div class="stat"><b>${S.best}</b><span>Best streak</span></div>
      <div class="stat"><b>${totalSpoken()}</b><span>Declarations spoken</span></div>
      <div class="stat"><b style="color:var(--mint)">${answered}</b><span>Prayers answered</span></div>
    </div>
    <div class="cal"><b>${now.toLocaleString(undefined,{month:'long',year:'numeric'})}</b><div class="cal-g">${cal}</div></div>
    <div><div class="sec-h"><h3>Streak milestones</h3></div><div class="badges">${MIL.map(m=>`<div class="badge ${S.best>=m?'got':''}"><b>${m}</b>${m===365?'1 year':'days'}</div>`).join('')}</div>
    <p class="muted" style="font-size:14px;margin-top:10px">Missed a day? One grace day each week keeps your streak alive, as long as you declared the day before.</p></div>

let speaking=false;
const canSpeak=()=>'speechSynthesis' in window;
function pickVoice(){
  const vs=speechSynthesis.getVoices()||[]; const good=n=>/(natural|premium|enhanced|neural|google|samantha|daniel|serena|arthur|martha|moira|karen)/i.test(n);
  for(const l of ['en-NG','en-GB','en-US','en-ZA','en-AU','en-IE']){const c=vs.filter(v=>(v.lang||'').replace('_','-').toLowerCase().startsWith(l.toLowerCase()));const g=c.find(v=>good(v.name));if(g)return g;if(c[0])return c[0]}
  return vs.find(v=>/^en/i.test(v.lang||''))||null;
}
function setListenUI(){const b=document.getElementById('listenBtn');if(!b)return;b.innerHTML=speaking?ICON.stop:ICON.listen;b.setAttribute('aria-label',speaking?'Stop listening':'Listen')}

  const parts=lines(x.text).map(l=>plain(l).replace(/\s—\s/g,', ')); const v=pickVoice();
  parts.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.rate=S.rate||0.92;u.pitch=1;if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';
    if(i===parts.length-1){u.onend=()=>{speaking=false;setListenUI()}} u.onerror=()=>{speaking=false;setListenUI()}; speechSynthesis.speak(u)});

}

function bindHold(){
  const b=document.getElementById('hold'); const DUR=1400; let t0=0,raf=0,on=false,fired=false;

  const step=()=>{const p=Math.min(1,(performance.now()-t0)/DUR);set(p);if(p>=1){fired=true;on=false;complete();return}raf=requestAnimationFrame(step)};
  const start=e=>{if(on||fired)return;if(e&&e.preventDefault)e.preventDefault();on=true;t0=performance.now();b.classList.add('active');b.querySelector('.lbl').textContent='Keep holding…';raf=requestAnimationFrame(step)};
  const stop=()=>{if(!on)return;on=false;cancelAnimationFrame(raf);set(0);b.classList.remove('active');b.querySelector('.lbl').textContent='Hold to declare'};

function share(){const x=get(SES.ids[SES.i]);shareCard(plain(x.text),x.sub)}
/* ---------- reminder ---------- */
const TIMES=[['05:00','5:00 am'],['06:00','6:00 am'],['07:00','7:00 am'],['12:00','Noon'],['21:00','9:00 pm'],['22:00','10:00 pm']];
function timePicker(attr){return `<div class="time-chips">${TIMES.map(([t,l])=>`<button class="chip" ${attr}="time" data-t="${t}" aria-pressed="${S.remind===t}">${l}</button>`).join('')}</div>
  <label class="muted" style="display:flex;align-items:center;gap:10px;font-size:15px">Or choose a time <input class="time" type="time" step="1800" value="${esc(S.remind||'')}" aria-label="Reminder time"></label>`}
function keepSafe(){return `<div class="keep"><b>Keep your streak safe</b><p>The Whop app clears your progress when you close it. Open Declare in your browser, then tap Share and "Add to Home Screen". Your streak, journal and settings will be saved there.</p><a href="${APP_URL}" target="_blank" rel="noopener">Open in browser</a></div>`}
function snap(t){let [h,m]=(t||'06:00').split(':').map(Number);m=m<15?0:m<45?30:60;if(m===60){m=0;h=(h+1)%24}return pad(h)+':'+pad(m)}
function prettyTime(t){const [h,m]=t.split(':').map(Number);const ap=h<12?'am':'pm';const hh=h%12||12;return hh+':'+pad(m)+' '+ap}
function openRemind(){
  const wrap=document.createElement('div');wrap.className='sheet-bg';
  wrap.innerHTML=`<div class="sheet" role="dialog" aria-label="Daily reminder"><h2 style="font-size:24px">When will you declare each day?</h2>${timePicker('data-r')}
    <div style="display:flex;gap:10px"><button class="btn btn-ghost" data-r="x">Cancel</button><button class="btn btn-primary" data-r="ok">Remind me</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('change',e=>{if(e.target.matches('input.time')){S.remind=e.target.value;wrap.querySelectorAll('[data-r="time"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t===S.remind))}});
  wrap.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(e.target===wrap||(b&&b.dataset.r==='x')){wrap.remove();return}if(!b)return;
    if(b.dataset.r==='time'){S.remind=b.dataset.t;wrap.querySelectorAll('[data-r="time"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t===S.remind));const ti=wrap.querySelector('input.time');if(ti)ti.value=S.remind}
    if(b.dataset.r==='ok'){const ti=wrap.querySelector('input.time');if(ti&&ti.value)S.remind=ti.value;S.remind=snap(S.remind||'06:00');save();toast('Whop will remind you at '+prettyTime(S.remind));wrap.remove();render()}});
}
document.addEventListener('change',e=>{if(e.target.matches('.ob input.time')){S.remind=e.target.value;document.querySelectorAll('[data-act="time"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t===S.remind))}});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(t&&!e.target.closest('.sheet-bg')){tab=t.dataset.tab;route=null;render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]'); if(!b||e.target.closest('.sheet-bg')||e.target.closest('.card-ov'))return; const a=b.dataset.act;
  if(a==='begin'){const ids=daily();const i=ids.findIndex(id=>!spokenToday(id));startSession(ids,Math.max(0,i),'daily')}
  if(a==='more'){startSession(buildSet(),0,'more')}
  if(a==='journey'){const ci=+b.dataset.ci;startSession(nextIds(ci,7,new Set()),0,'journey')}
  if(a==='cat'){route={name:'sub',ci:+b.dataset.ci};render();window.scrollTo(0,0)}
  if(a==='back'){route=null;render()}
  if(a==='subopen'){const ci=+b.dataset.ci,si=+b.dataset.si;startSession(nextIds(ci,7,new Set(),si),0,'deck')}
  if(a==='one'){const x=get(b.dataset.id);const d=DATA[x.ci].s[x.si].d;const ids=[];for(let k=x.di;k<Math.min(d.length,x.di+7);k++)ids.push(x.ci+'.'+x.si+'.'+k);startSession(ids,0,'deck')}
  if(a==='savedopen'){startSession([...S.saved],+b.dataset.k,'saved')}
  if(a==='addfocus'){const ci=+b.dataset.ci;if(S.focus.length>=3){toast('You have 3 journeys. Edit them in Settings.');return}S.focus.push(ci);plan(ci);save();render();toast('Added to your journeys')}
  if(a==='settings'){openSettings()}
  if(a==='close'){stopSpeak();route=null;render();window.scrollTo(0,0)}
  if(a==='listen'){if(speaking)stopSpeak();else speakCurrent()}
  if(a==='planagain'){const ci=+b.dataset.ci;const p=plan(ci);S.plans[ci]={start:dayKey(),days:{},round:p.round+1,done:false};save();render();toast('Round '+(p.round+1)+' started')}
  if(a==='remindsheet'){openRemind()}
  if(a==='sharetest'){const n=S.notes.find(n=>n.id===+b.dataset.nid);if(n)shareCard('\u201C'+n.text+'\u201D  God answered this prayer.','Answered prayer')}
  if(a==='time'){S.remind=b.dataset.t;document.querySelectorAll('[data-act="time"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t===S.remind));const ti=document.querySelector('input.time');if(ti)ti.value=S.remind;return}
  if(a==='ob-remind'){const ti=document.querySelector('input.time');if(ti&&ti.value)S.remind=ti.value;if(!S.remind)S.remind='06:00';S.remind=snap(S.remind);save();toast('Reminder set for '+prettyTime(S.remind));obStep++;renderOb();window.scrollTo(0,0);return}
  if(a==='prev'){if(SES.i>0){stopSpeak();SES.i--;renderSession()}}
  if(a==='skip'){advance()}
  if(a==='save'){const id=SES.ids[SES.i];if(S.saved.includes(id)){S.saved=S.saved.filter(x=>x!==id);toast('Removed from saved')}else{S.saved.unshift(id);toast('Saved')}save();
    const nowSaved=S.saved.includes(id);b.innerHTML=nowSaved?ICON.savedFill:ICON.saved;b.setAttribute('aria-pressed',nowSaved)}
  if(a==='share'){share()}
  if(a==='home'){route=null;tab='today';render();window.scrollTo(0,0)}
  if(a==='savenote'){const v=document.getElementById('note').value.trim();if(!v){toast('Write something first');return}S.notes.push({id:Date.now(),date:new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}),text:v,answered:false});save();document.getElementById('note').value='';toast('Saved to your journal')}
  if(a==='newnote'){route=null;tab='progress';render();openNote()}
  if(a==='answer'){const n=S.notes.find(n=>n.id===+b.dataset.nid);if(n){n.answered=true;n.answeredDate=new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});save();render();toast('Glory to God')}}
  if(a==='ob-next'){if(obStep===2&&!obFocus.length)return;obStep++;renderOb();window.scrollTo(0,0)}
  if(a==='ob-chip'){const ci=+b.dataset.ci;if(obFocus.includes(ci))obFocus=obFocus.filter(x=>x!==ci);else if(obFocus.length<3)obFocus.push(ci);else{toast('Choose up to 3');return}renderOb()}
  if(a==='skin'){S.skin=b.dataset.k;applyTheme();save();document.querySelectorAll('[data-act="skin"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===S.skin));return}
  if(a==='personalise'){obActive=true;obStep=1;obName=S.name||'';obFocus=[...S.focus];renderOb();window.scrollTo(0,0);return}
  if(a==='notnow'){hidePers=true;render();return}
  if(a==='ob-close'){obActive=false;render();window.scrollTo(0,0);return}
  if(a==='ob-finish'){obActive=false;S.personalised=true;S.name=obName.trim();S.focus=obFocus;S.focus.forEach(plan);S.onboarded=true;S.daily=null;save();tab='today';const ids=daily();startSession(ids,0,'daily')}
});
function openNote(){
  const wrap=document.createElement('div');wrap.className='sheet-bg';
  wrap.innerHTML=`<div class="sheet" role="dialog" aria-label="New journal entry"><h2 style="font-size:24px">What are you believing God for?</h2>
    <textarea id="nn" placeholder="Write it down. When He answers, mark it here."></textarea>
    <div style="display:flex;gap:10px"><button class="btn btn-ghost" data-n="x">Cancel</button><button class="btn btn-primary" data-n="ok">Save</button></div></div>`;
  document.body.appendChild(wrap); document.getElementById('nn').focus();
  wrap.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(e.target===wrap||(b&&b.dataset.n==='x')){wrap.remove();return}
    if(b&&b.dataset.n==='ok'){const v=document.getElementById('nn').value.trim();if(!v){toast('Write something first');return}
      S.notes.push({id:Date.now(),date:new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}),text:v,answered:false});save();wrap.remove();render();toast('Saved to your journal')}});
}
/* new day: refresh Today automatically after midnight, when the app is reopened or comes back to the foreground */
let lastDay=dayKey();
function checkDay(){ if(dayKey()!==lastDay){ lastDay=dayKey(); S.best=Math.max(S.best||0,streak()); save(); if(!route||route.name==='sub') render(); } }
setInterval(checkDay,30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkDay() });
window.addEventListener('focus',checkDay);
window.addEventListener('pageshow',checkDay);
async function boot(){
  if(!S.onboarded){S.onboarded=true;S.personalised=false;obActive=true;obStep=0;save()}
  render();
}
/* offline mode removed: switch off any previously installed copy */
if('serviceWorker' in navigator){try{navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}catch(e){}}
boot();
};
</script>

<script>
(function(){
  const app=document.getElementById('app');
  const screen=(title,msg,btn)=>{app.innerHTML=`<section class="ob hero"><div class="grow"><span class="eyebrow" style="color:var(--glow-solid)">Declare</span><h1>${title}</h1>${msg?`<p>${msg}</p>`:''}</div>${btn||''}</section>`};
  const loading=step=>{app.innerHTML=`<section class="ob hero"><div class="grow"><span class="eyebrow" style="color:var(--glow-solid)">Declare</span><h1>Opening Declare</h1><div class="ld-bar"><span></span></div><p class="ld-step">${step}</p></div></section>`};
  const setStep=t=>{const el=app.querySelector('.ld-step');if(el)el.textContent=t;else loading(t)};
  const st=document.createElement('style');st.textContent='.ld-bar{height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px;max-width:260px}.ld-bar span{display:block;height:100%;width:40%;border-radius:4px;background:var(--glow-solid,#FFB79B);animation:ldm 1.1s ease-in-out infinite}@keyframes ldm{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}.ld-step{opacity:.8;transition:opacity .3s}';document.head.appendChild(st);
  loading('Preparing your declarations…');
  const m=location.pathname.match(/exp_[A-Za-z0-9]+/); const exp=m?m[0]:'';
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let RESUME='';try{RESUME=localStorage.getItem('declare_resume')||''}catch(e){}
  window.__authH=()=>RESUME?{'x-declare-resume':RESUME}:{};
  const reloadBtn='<button class="btn btn-light" id="retry">Open Declare again</button>';
  const bindRetry=()=>{const t=document.getElementById('retry'); if(t) t.onclick=()=>{t.disabled=true;t.textContent='Opening…';loading('Reconnecting to Whop…');go(true)}};
  async function session(){
    for(let k=0;k<3;k++){
      const r=await fetch('/api/session?exp='+encodeURIComponent(exp)+'&t='+Date.now(),{headers:window.__authH(),credentials:'same-origin',cache:'no-store'});
      if(r.status!==401) return r;
      setStep('Reconnecting to Whop…'); await sleep(700*(k+1));
    }
    return {status:401};
  }
  async function go(again){
    try{
      const dataP=fetch('/api/data',{credentials:'same-origin'}).then(d=>{if(!d.ok)throw new Error('data');return d.text()});
      dataP.catch(()=>{});
      const r=await session();
      if(r.status===401){screen('Let’s try that again','Whop needs a moment to reconnect. Tap below and Declare will open.',reloadBtn);bindRetry();return}
      if(r.status===403){screen('Your membership is not active','Renew your Declare membership on Whop to keep speaking the Word every day.');return}
      if(!r.ok) throw new Error('session '+r.status);
      setStep('Loading your declarations…');
      const [sess,txt64]=await Promise.all([r.json(),dataP]);
      if(sess.resume){RESUME=sess.resume;try{localStorage.setItem('declare_resume',RESUME)}catch(e){}}
      setStep('Almost there…');
      const raw=b64(txt64.trim());
      const key=await crypto.subtle.importKey('raw',b64(sess.key),{name:'AES-GCM'},false,['decrypt']);
      const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
      const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      window.__startDeclare(JSON.parse(txt), sess.state||null);
    }catch(e){
      screen('Could not open Declare','Check your connection and try again.',reloadBtn);bindRetry();
    }
  }
  go();
})();
</script>
